name: Release to NuGet

# Publishes Umbraco.Community.SchemeWeaver to nuget.org. The Umbraco Marketplace
# discovers packages automatically from nuget.org that carry the "umbraco-marketplace"
# tag (already set in the csproj), so pushing here is all that is required for the
# listing to appear on marketplace.umbraco.com within ~24 hours.
#
# Trigger by pushing a tag like `v18.0.0`, or by dispatching manually from the
# Actions tab. The tag is only a trigger + GitHub-release label — the packed
# version comes from $(SchemeWeaverPackageVersion) in Directory.Build.props, which
# is major-aligned per leg (17.x for the Umbraco 17 build, 18.x for the Umbraco 18
# build), so both ship as stable and NuGet auto-selects the right one per consumer.

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for an out-of-band publish. No version input: the packed version
  # is sourced from $(SchemeWeaverPackageVersion) in Directory.Build.props per leg.
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub release
  packages: write  # needed to publish NuGet packages to GitHub Packages

jobs:
  release:
    name: Pack & Push (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One source tree, packed per Umbraco major (see Directory.Build.props).
        umbraco: ['17', '18']
    steps:
      - uses: actions/checkout@v5

      # No version-from-tag step: each leg packs at $(SchemeWeaverPackageVersion)
      # from Directory.Build.props (17.x for the 17 leg, 18.x for the 18 leg). The
      # tag/dispatch input is only the trigger and the GitHub-release name.

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      # The backend project embeds the built frontend as static web assets, so
      # the Vite output has to exist before `dotnet build` runs.
      - name: Install frontend dependencies
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm ci

      - name: Build frontend
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm run build

      - name: Restore
        run: dotnet restore -p:UmbracoMajor=${{ matrix.umbraco }}

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }}

      - name: Test
        run: dotnet test --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal

      - name: Pack
        run: dotnet pack src/Umbraco.Community.SchemeWeaver/Umbraco.Community.SchemeWeaver.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Pack uSync satellite
        run: dotnet pack src/Umbraco.Community.SchemeWeaver.uSync/Umbraco.Community.SchemeWeaver.uSync.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      # AI satellite is Umbraco 17-only (Umbraco.AI 1.14 has no Umbraco 18 build), so it
      # is packed on the 17 leg only. It is versioned independently of the release tag —
      # it ships at its own prerelease version from the csproj (<Version>), so the
      # push step's --skip-duplicate makes this a no-op on tags that don't bump it.
      # --no-build is omitted intentionally: the AI project isn't in the solution the
      # Build step compiles, and its frontend (wwwroot/) is produced by the AI pack target.
      - name: Pack AI satellite (Umbraco 17 only)
        if: matrix.umbraco == '17'
        run: dotnet pack src/Umbraco.Community.SchemeWeaver.AI/Umbraco.Community.SchemeWeaver.AI.csproj --configuration Release -p:UmbracoMajor=17 --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package-umbraco${{ matrix.umbraco }}
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions before releasing."
            exit 1
          fi
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      # Create the GitHub release once (on the 17 leg). Both per-major packages are
      # already pushed to NuGet by their own matrix legs above (17.x and 18.x, both
      # stable); the 18.x nupkg can be attached to the release manually when finalising
      # a dual release.
      # NB: generate_release_notes produces near-empty notes here — overwrite with
      # hand-crafted notes via `gh release edit` before considering the release shipped.
      - name: Create GitHub release
        if: github.event_name == 'push' && matrix.umbraco == '17'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
