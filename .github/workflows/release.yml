name: Release to NuGet

# Publishes Umbraco.Community.SchemeWeaver to nuget.org. The Umbraco Marketplace
# discovers packages automatically from nuget.org that carry the "umbraco-marketplace"
# tag (already set in the csproj), so pushing here is all that is required for the
# listing to appear on marketplace.umbraco.com within ~24 hours.
#
# Trigger by pushing a tag like `v18.0.0`, or by dispatching manually from the
# Actions tab. The trigger is only a trigger — the packed version comes from
# $(SchemeWeaverPackageVersion) in Directory.Build.props, major-aligned per leg
# (17.x for the Umbraco 17 build, 18.x for the Umbraco 18 build), so both ship as
# stable and NuGet auto-selects the right one per consumer. Each leg also publishes
# its OWN GitHub release (v17.x and v18.x) with its own packages, so both lines are
# visible in the Releases section.

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual trigger for an out-of-band publish. No version input: the packed version
  # is sourced from $(SchemeWeaverPackageVersion) in Directory.Build.props per leg.
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub release
  packages: write  # needed to publish NuGet packages to GitHub Packages

jobs:
  release:
    name: Pack & Push (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One source tree, packed per Umbraco major (see Directory.Build.props).
        umbraco: ['17', '18']
    steps:
      - uses: actions/checkout@v7

      # No version-from-tag step: each leg packs at $(SchemeWeaverPackageVersion)
      # from Directory.Build.props (17.x for the 17 leg, 18.x for the 18 leg). The
      # tag/dispatch input is only the trigger and the GitHub-release name.

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      # The backend project embeds the built frontend as static web assets, so
      # the Vite output has to exist before `dotnet build` runs.
      - name: Install frontend dependencies
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm ci

      - name: Build frontend
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm run build

      - name: Restore
        run: dotnet restore -p:UmbracoMajor=${{ matrix.umbraco }}

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }}

      # The per-leg package version (17.x / 18.x) from Directory.Build.props — used as
      # this leg's GitHub release tag + name so each major shows up as its own release.
      - name: Resolve package version
        id: ver
        run: echo "version=$(dotnet msbuild src/Umbraco.Community.SchemeWeaver/Umbraco.Community.SchemeWeaver.csproj -getProperty:SchemeWeaverPackageVersion -p:UmbracoMajor=${{ matrix.umbraco }})" >> "$GITHUB_OUTPUT"

      # Sequential per-project test runs — see build.yml's Test step for why a
      # solution-level `dotnet test` (parallel projects, shared content root)
      # flakes the Deploy suite.
      - name: Test
        run: |
          dotnet test tests/Umbraco.Community.SchemeWeaver.Tests/Umbraco.Community.SchemeWeaver.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal
          dotnet test tests/Umbraco.Community.SchemeWeaver.Deploy.Tests/Umbraco.Community.SchemeWeaver.Deploy.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal

      - name: Pack
        run: dotnet pack src/Umbraco.Community.SchemeWeaver/Umbraco.Community.SchemeWeaver.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Pack uSync satellite
        run: dotnet pack src/Umbraco.Community.SchemeWeaver.uSync/Umbraco.Community.SchemeWeaver.uSync.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Pack Deploy satellite
        run: dotnet pack src/Umbraco.Community.SchemeWeaver.Deploy/Umbraco.Community.SchemeWeaver.Deploy.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      # AI satellite ships per-major like the rest of the suite, at this leg's stable
      # $(SchemeWeaverPackageVersion) (17.x on the 17 leg, 18.x on the 18 leg). The AI
      # project IS in the solution the Build step compiles, but --no-build is still
      # omitted intentionally: the EnsureAIFrontendBuiltBeforePack target in the AI
      # csproj must be free to run npm and rebuild after the frontend (wwwroot/) lands
      # (Node.js is set up earlier in this job).
      - name: Pack AI satellite
        run: dotnet pack src/Umbraco.Community.SchemeWeaver.AI/Umbraco.Community.SchemeWeaver.AI.csproj --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-umbraco${{ matrix.umbraco }}
          path: ./artifacts/*.nupkg

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions before releasing."
            exit 1
          fi
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      # One GitHub release PER major, each at its own version (v17.x / v18.x) with its
      # own packages attached, so both lines appear in the Releases section (like uSync).
      # The trigger tag/dispatch is only a trigger — each leg derives its own release tag
      # from $(SchemeWeaverPackageVersion). action-gh-release creates the tag if missing
      # and updates the release if it already exists, so this is idempotent across re-runs.
      # NB: generate_release_notes produces near-empty notes — overwrite with hand-crafted
      # notes via `gh release edit` before considering the release shipped.
      - name: Create GitHub release (Umbraco ${{ matrix.umbraco }})
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
