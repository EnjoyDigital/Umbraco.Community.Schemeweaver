name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend unit & component
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (for web-test-runner)
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Unit & component tests
        run: npm test

      - name: Unit & component tests (MSW)
        run: npm run test:msw

  # The MCP server had no CI at all until now: `npm run compile` and its Jest
  # suite only ever ran on a maintainer's machine, so every MCP dependency PR
  # merged on the strength of unrelated checks. This job type-checks and bundles
  # it. The Jest suite is NOT run here — those tests hit a live Umbraco instance
  # from .env credentials, which CI has no access to; they stay a local gate.
  mcp:
    name: MCP server type-check & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Community.SchemeWeaver.Mcp
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver.Mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Build bundle
        run: npm run build

      # dist/index.js is committed and is what the Claude Code plugin runs, so a
      # PR that changes the bundle must ship the rebuilt file. Fail loudly rather
      # than let main drift from what `npm run build` actually produces.
      # core.fileMode=false because tsup sets the executable bit on the bin entry,
      # which git reports as a change even when the bytes are identical — the
      # first run of this job failed on exactly that (0 insertions, 0 deletions).
      - name: Verify committed dist/index.js is up to date
        run: |
          if ! git -c core.fileMode=false diff --quiet -- dist/index.js; then
            echo "::error::dist/index.js is stale — run 'npm run build' in src/Umbraco.Community.SchemeWeaver.Mcp and commit the result."
            git diff --stat -- dist/index.js
            exit 1
          fi
          echo "dist/index.js matches the build output."

      - name: Smoke-test the bundle
        run: node dist/index.js --list-tools

  backend:
    name: C# unit & integration (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One source tree, compiled per Umbraco major (see Directory.Build.props).
        umbraco: ['17', '18']
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      # The backend package embeds dist/ as static web assets, so it has
      # to exist before `dotnet build` or the SchemeWeaver csproj won't
      # find its wwwroot content.
      - name: Install frontend dependencies
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm ci

      - name: Build frontend
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm run build

      - name: Restore
        run: dotnet restore -p:UmbracoMajor=${{ matrix.umbraco }}

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }}

      # The two test projects run as SEPARATE sequential commands, never one
      # solution-level `dotnet test`: solution-level runs execute the projects in
      # parallel, and both boot Umbraco hosts against the same TestHost content
      # root — the losing host's Deploy environment worker then silently refuses
      # disk-read work (MainDom/worker contention), flaking the Deploy suite.
      - name: Test (unit + integration)
        run: |
          dotnet test tests/Umbraco.Community.SchemeWeaver.Tests/Umbraco.Community.SchemeWeaver.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/Umbraco.Community.SchemeWeaver.Deploy.Tests/Umbraco.Community.SchemeWeaver.Deploy.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal --logger "trx;LogFileName=test-results-deploy.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results-umbraco${{ matrix.umbraco }}
          path: '**/TestResults/*.trx'

      - name: Pack (SchemeWeaver + uSync + Deploy addons)
        run: |
          dotnet pack src/Umbraco.Community.SchemeWeaver/Umbraco.Community.SchemeWeaver.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts
          dotnet pack src/Umbraco.Community.SchemeWeaver.uSync/Umbraco.Community.SchemeWeaver.uSync.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts
          dotnet pack src/Umbraco.Community.SchemeWeaver.Deploy/Umbraco.Community.SchemeWeaver.Deploy.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-umbraco${{ matrix.umbraco }}
          path: ./artifacts/*.nupkg
