name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend unit & component
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (for web-test-runner)
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build

      - name: Unit & component tests
        run: npm test

      - name: Unit & component tests (MSW)
        run: npm run test:msw

  backend:
    name: C# unit & integration (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One source tree, compiled per Umbraco major (see Directory.Build.props).
        umbraco: ['17', '18']
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver/package-lock.json

      # The backend package embeds dist/ as static web assets, so it has
      # to exist before `dotnet build` or the SchemeWeaver csproj won't
      # find its wwwroot content.
      - name: Install frontend dependencies
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm ci

      - name: Build frontend
        working-directory: src/Umbraco.Community.SchemeWeaver/App_Plugins/SchemeWeaver
        run: npm run build

      - name: Restore
        run: dotnet restore -p:UmbracoMajor=${{ matrix.umbraco }}

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }}

      # The two test projects run as SEPARATE sequential commands, never one
      # solution-level `dotnet test`: solution-level runs execute the projects in
      # parallel, and both boot Umbraco hosts against the same TestHost content
      # root — the losing host's Deploy environment worker then silently refuses
      # disk-read work (MainDom/worker contention), flaking the Deploy suite.
      - name: Test (unit + integration)
        run: |
          dotnet test tests/Umbraco.Community.SchemeWeaver.Tests/Umbraco.Community.SchemeWeaver.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal --logger "trx;LogFileName=test-results.trx"
          dotnet test tests/Umbraco.Community.SchemeWeaver.Deploy.Tests/Umbraco.Community.SchemeWeaver.Deploy.Tests.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --verbosity normal --logger "trx;LogFileName=test-results-deploy.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results-umbraco${{ matrix.umbraco }}
          path: '**/TestResults/*.trx'

      - name: Pack (SchemeWeaver + uSync + Deploy addons)
        run: |
          dotnet pack src/Umbraco.Community.SchemeWeaver/Umbraco.Community.SchemeWeaver.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts
          dotnet pack src/Umbraco.Community.SchemeWeaver.uSync/Umbraco.Community.SchemeWeaver.uSync.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts
          dotnet pack src/Umbraco.Community.SchemeWeaver.Deploy/Umbraco.Community.SchemeWeaver.Deploy.csproj --no-build --configuration Release -p:UmbracoMajor=${{ matrix.umbraco }} --output ./artifacts

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages-umbraco${{ matrix.umbraco }}
          path: ./artifacts/*.nupkg
